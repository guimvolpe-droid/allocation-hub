# One command to run the whole thing: `docker compose up --build`, then open http://localhost:8080.
# API keys (optional) are read from a local .env file next to this compose file — never committed.
services:
  api:
    build:
      context: .
      dockerfile: src/AllocationHub.Api/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=Data Source=/app/data/allocationhub.db
      # Optional — set these in ./.env to enable the live LLM switch and lift the GitHub rate limit.
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - api-data:/app/data
    expose:
      - "8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  api-data:
